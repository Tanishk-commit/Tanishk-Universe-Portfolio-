<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tanishk Kekan — Personal Universe</title>
<meta name="description" content="Tanishk Kekan — Software Engineer, AI & ML enthusiast, full-stack developer. An interactive 3D portfolio." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- tokens */
:root{
  --void:#03050c; --deep:#060b18; --mid:#0b1426;
  --ink:#eaf1ff; --muted:#8ea4c6; --dim:#61738f;
  --ion:#63e2ff; --signal:#3d7bff; --violet:#8d7bff; --warm:#ffd9a0;
  --glass:rgba(10,18,34,.55); --glass-2:rgba(8,14,28,.78);
  --line:rgba(124,176,255,.16); --line-2:rgba(124,176,255,.34);
  --shadow:0 24px 80px rgba(0,0,0,.6);
  --display:'Sora','Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;
  --body:'Inter','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --void:#03050c; --ink:#eaf1ff; } }
:root[data-theme="dark"]{ --void:#03050c; --ink:#eaf1ff; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--body); font-weight:300; -webkit-font-smoothing:antialiased;
  overflow:hidden; overscroll-behavior:none;
}
body.text-mode{overflow:auto}
canvas#scene{position:fixed; inset:0; display:block; touch-action:none; cursor:grab}
canvas#scene.grabbing{cursor:grabbing}
canvas#scene.pointing{cursor:pointer}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%);}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ion); outline-offset:3px; border-radius:6px}

/* ------------------------------------------------------------ typography */
h1,h2,h3{font-family:var(--display); font-weight:300; margin:0; letter-spacing:-.01em}
.eyebrow{font-size:.68rem; letter-spacing:.26em; color:var(--dim); font-weight:400}

/* ---------------------------------------------------------------- loader */
#loader{position:fixed;inset:0;z-index:100;background:var(--void);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;
  transition:opacity .9s ease, visibility .9s}
#loader.done{opacity:0;visibility:hidden}
#loader .ring{width:86px;height:86px;border-radius:50%;position:relative}
#loader .ring::before,#loader .ring::after{content:"";position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(99,226,255,.22)}
#loader .ring::after{inset:16px;border-color:rgba(141,123,255,.3);
  animation:spin 3.2s linear infinite}
#loader .ring i{position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;
  background:var(--ion);box-shadow:0 0 14px var(--ion);transform-origin:3px 46px;animation:spin 2.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadTitle{font-family:var(--display);font-weight:200;font-size:clamp(1rem,2.4vw,1.35rem);letter-spacing:.34em;color:var(--ink)}
#loadLog{height:1.2em;font-size:.82rem;color:var(--muted);letter-spacing:.12em}
#loadBarWrap{width:min(320px,62vw);height:1px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
#loadBar{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--signal),var(--ion));
  transition:right .4s cubic-bezier(.2,.8,.2,1)}

/* ------------------------------------------------------------------- nav */
#nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:1rem;
  padding:1.05rem clamp(1rem,3vw,2.2rem);opacity:0;transform:translateY(-14px);
  transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#nav.on{opacity:1;transform:none;pointer-events:auto}
#brand{display:flex;align-items:baseline;gap:.6rem;background:none;border:0;padding:.2rem .1rem;cursor:pointer}
#brand b{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.18em}
#brand span{font-size:.64rem;letter-spacing:.24em;color:var(--dim)}
#navlist{display:flex;gap:.1rem;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.navbtn{background:none;border:0;cursor:pointer;font-size:.72rem;letter-spacing:.15em;
  color:var(--muted);padding:.5rem .62rem;border-radius:999px;transition:color .25s,background .25s;position:relative}
.navbtn:hover{color:var(--ink);background:rgba(120,170,255,.08)}
.navbtn[aria-current="true"]{color:var(--ink)}
.navbtn[aria-current="true"]::after{content:"";position:absolute;left:.62rem;right:.62rem;bottom:.24rem;height:1px;background:var(--ion);box-shadow:0 0 8px var(--ion)}
#menuBtn{display:none;margin-left:auto;background:rgba(10,18,34,.6);border:1px solid var(--line);
  border-radius:999px;padding:.5rem .9rem;font-size:.72rem;letter-spacing:.16em;cursor:pointer;backdrop-filter:blur(14px)}
#textBtn{background:none;border:1px solid var(--line);border-radius:999px;padding:.44rem .8rem;
  font-size:.66rem;letter-spacing:.14em;color:var(--muted);cursor:pointer;margin-left:.5rem}
#textBtn:hover{color:var(--ink);border-color:var(--line-2)}

/* ------------------------------------------------------------------ hero */
#hero{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;pointer-events:none;padding:1.5rem;
  transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
#hero.hidden{opacity:0;transform:scale(1.06);visibility:hidden}
#heroName{position:relative;font-family:var(--display);font-weight:200;line-height:.98;
  font-size:clamp(2.6rem,10.5vw,8.2rem);letter-spacing:.02em;display:flex;gap:.02em;
  filter:drop-shadow(0 0 34px rgba(61,123,255,.28));will-change:transform}
#heroName .w{display:flex}
#heroName .sp{width:.34em}
#heroName .l{display:inline-block;opacity:0;transform:translateY(.5em) scale(.94);filter:blur(12px);
  background:linear-gradient(180deg,#ffffff 0%,#cfe3ff 42%,#7fb2ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1),filter .9s ease}
#heroName.in .l{opacity:1;transform:none;filter:blur(0)}
#shine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:linear-gradient(100deg,transparent 42%,rgba(160,215,255,.55) 50%,transparent 58%);
  background-size:280% 100%}
#shine.go{opacity:1;animation:sweep 2.6s cubic-bezier(.3,.1,.2,1) .35s 1 both}
@keyframes sweep{from{background-position:180% 0}to{background-position:-90% 0}}
#heroSub{margin-top:1.5rem;font-size:clamp(.72rem,1.6vw,.95rem);letter-spacing:.3em;
  color:var(--muted);opacity:0;transform:translateY(12px);transition:opacity 1s ease .9s,transform 1s ease .9s}
#heroSub.in{opacity:1;transform:none}
#heroLine{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--ion),transparent);
  margin:1.5rem 0 0;transition:width 1.4s cubic-bezier(.2,.8,.2,1) 1.1s}
#heroLine.in{width:min(420px,70vw)}
#enter{margin-top:2.3rem;pointer-events:auto;opacity:0;transform:translateY(10px);
  transition:opacity .8s ease 1.5s,transform .8s ease 1.5s,border-color .3s,background .3s;
  background:rgba(10,20,40,.4);border:1px solid var(--line-2);color:var(--ink);
  padding:.95rem 2.1rem;border-radius:999px;font-size:.72rem;letter-spacing:.28em;cursor:pointer;
  backdrop-filter:blur(16px)}
#enter.in{opacity:1;transform:none}
#enter:hover{background:rgba(61,123,255,.16);border-color:var(--ion)}
#homeTag{position:fixed;left:clamp(1rem,3vw,2.2rem);bottom:clamp(1rem,3vw,2rem);z-index:25;
  opacity:0;transition:opacity .7s;pointer-events:none}
#homeTag.on{opacity:1}
#homeTag b{font-family:var(--display);font-weight:300;font-size:1.05rem;letter-spacing:.14em;display:block}
#homeTag span{font-size:.66rem;letter-spacing:.2em;color:var(--dim)}

/* --------------------------------------------------------------- tooltip */
#tip{position:fixed;z-index:35;pointer-events:none;opacity:0;transform:translate(-50%,-140%) scale(.96);
  transition:opacity .22s ease,transform .22s cubic-bezier(.2,.8,.2,1);
  background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:.6rem .85rem;
  backdrop-filter:blur(18px);box-shadow:var(--shadow);max-width:250px;text-align:left}
#tip.on{opacity:1;transform:translate(-50%,-160%) scale(1)}
#tip b{display:block;font-family:var(--display);font-weight:400;font-size:.86rem;letter-spacing:.04em}
#tip small{display:block;color:var(--muted);font-size:.72rem;margin-top:.22rem;line-height:1.45}

/* ----------------------------------------------------------------- panel */
#panelWrap{position:fixed;z-index:50;inset:0;display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;padding:clamp(.6rem,2vw,2rem)}
@media(min-width:880px){#panelWrap{align-items:center;justify-content:flex-end;padding-right:clamp(1rem,4vw,3.4rem)}}
#panel{pointer-events:auto;width:min(560px,100%);max-height:min(78vh,760px);overflow:auto;
  background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(26px);
  box-shadow:var(--shadow);padding:clamp(1.2rem,2.6vw,1.9rem);
  opacity:0;transform:translateY(28px) scale(.98);visibility:hidden;
  transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility .45s;
  scrollbar-width:thin;scrollbar-color:rgba(124,176,255,.3) transparent}
#panel.on{opacity:1;transform:none;visibility:visible}
#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:rgba(124,176,255,.28);border-radius:8px}
.phead{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.3rem}
.phead h2{font-size:clamp(1.35rem,3.4vw,1.85rem);font-weight:300;line-height:1.1}
.phead .eyebrow{margin-bottom:.45rem}
.pclose{margin-left:auto;background:none;border:1px solid var(--line);border-radius:50%;
  width:34px;height:34px;flex:none;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;
  transition:border-color .25s,color .25s,transform .25s}
.pclose:hover{color:var(--ink);border-color:var(--line-2);transform:rotate(90deg)}
#panel p{color:var(--muted);line-height:1.72;font-size:.92rem;margin:0 0 1rem;max-width:62ch}
#panel strong{color:var(--ink);font-weight:400}
.rows{display:grid;gap:.1rem;margin:0 0 1.3rem}
.row{display:grid;grid-template-columns:8.2rem 1fr;gap:1rem;padding:.62rem 0;border-top:1px solid var(--line)}
.row dt{color:var(--dim);font-size:.72rem;letter-spacing:.14em}
.row dd{margin:0;font-size:.9rem;color:var(--ink);font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 1.2rem}
.chip{font-size:.7rem;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:.3rem .68rem;background:rgba(120,170,255,.05)}
.chip.hot{color:var(--ion);border-color:rgba(99,226,255,.42);background:rgba(99,226,255,.08)}
.acts{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;background:rgba(61,123,255,.14);
  border:1px solid rgba(99,226,255,.34);color:var(--ink);text-decoration:none;cursor:pointer;
  padding:.68rem 1.15rem;border-radius:999px;font-size:.74rem;letter-spacing:.12em;
  transition:background .25s,border-color .25s,transform .25s}
.btn:hover{background:rgba(99,226,255,.24);border-color:var(--ion);transform:translateY(-1px)}
.btn.ghost{background:none;border-color:var(--line)}
.btn.ghost:hover{background:rgba(120,170,255,.08);border-color:var(--line-2)}
.note{font-size:.7rem;color:var(--dim);line-height:1.6;margin-top:.9rem;padding-left:.7rem;
  border-left:1px solid rgba(255,217,160,.35)}
.list{list-style:none;padding:0;margin:0 0 1.2rem;display:grid;gap:.55rem}
.list li{position:relative;padding-left:1.05rem;color:var(--muted);font-size:.87rem;line-height:1.6}
.list li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;
  background:var(--signal);box-shadow:0 0 8px rgba(61,123,255,.8)}
.cards{display:grid;gap:.6rem}
.card{width:100%;text-align:left;background:rgba(120,170,255,.045);border:1px solid var(--line);
  border-radius:14px;padding:.85rem 1rem;cursor:pointer;transition:border-color .25s,background .25s,transform .25s}
.card:hover{border-color:var(--line-2);background:rgba(120,170,255,.1);transform:translateX(3px)}
.card b{display:block;font-family:var(--display);font-weight:400;font-size:.95rem;margin-bottom:.22rem}
.card small{color:var(--dim);font-size:.74rem;letter-spacing:.06em}
.tl{position:relative;padding-left:1.4rem;margin-bottom:1.2rem}
.tl::before{content:"";position:absolute;left:4px;top:.4rem;bottom:.4rem;width:1px;
  background:linear-gradient(180deg,var(--ion),rgba(99,226,255,0))}
.tl .node{position:relative;padding-bottom:1.1rem}
.tl .node::before{content:"";position:absolute;left:-1.4rem;top:.42rem;width:9px;height:9px;border-radius:50%;
  background:var(--void);border:1px solid var(--ion);box-shadow:0 0 10px rgba(99,226,255,.7)}
.tl b{display:block;font-family:var(--display);font-weight:400;font-size:.95rem}
.tl small{color:var(--dim);font-size:.72rem;letter-spacing:.1em}
.tl p{margin:.4rem 0 0}
.field{display:grid;gap:.38rem;margin-bottom:.85rem}
.field label{font-size:.68rem;letter-spacing:.16em;color:var(--dim)}
.field input,.field textarea{background:rgba(3,6,14,.6);border:1px solid var(--line);border-radius:10px;
  padding:.72rem .85rem;color:var(--ink);font-family:var(--body);font-size:.9rem;font-weight:300;
  transition:border-color .25s,background .25s}
.field textarea{min-height:104px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ion);background:rgba(8,16,32,.8)}
.field .err{font-size:.7rem;color:#ff9a9a;min-height:1em}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:#ff7b7b}
#formMsg{font-size:.82rem;color:var(--ion);margin-top:.6rem;min-height:1.2em}
.meter{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.35rem}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--ion))}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.55rem;margin-bottom:1.1rem}
.sk{border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;background:rgba(120,170,255,.04)}
.sk b{font-size:.8rem;font-weight:400;font-family:var(--display)}
.sk small{display:block;color:var(--dim);font-size:.68rem;margin-top:.15rem}

/* ------------------------------------------------------------------ misc */
#hint{position:fixed;right:clamp(1rem,3vw,2.2rem);bottom:clamp(1rem,3vw,2rem);z-index:24;
  font-size:.66rem;letter-spacing:.16em;color:var(--dim);text-align:right;opacity:0;transition:opacity .8s;pointer-events:none}
#hint.on{opacity:1}
#back{position:fixed;left:50%;bottom:clamp(1rem,3vw,2rem);transform:translateX(-50%) translateY(20px);
  z-index:45;opacity:0;visibility:hidden;transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1),visibility .4s;
  background:var(--glass-2);border:1px solid var(--line-2);border-radius:999px;padding:.7rem 1.4rem;
  font-size:.68rem;letter-spacing:.2em;cursor:pointer;backdrop-filter:blur(18px);color:var(--ink)}
#back.on{opacity:1;visibility:visible;transform:translateX(-50%)}
#back:hover{border-color:var(--ion);background:rgba(61,123,255,.2)}
#toast{position:fixed;left:50%;top:clamp(4.5rem,9vh,6.5rem);transform:translateX(-50%) translateY(-14px);
  z-index:60;opacity:0;visibility:hidden;transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1),visibility .4s;
  background:var(--glass-2);border:1px solid var(--line);border-radius:14px;padding:.75rem 1.2rem;
  backdrop-filter:blur(18px);font-size:.82rem;color:var(--ink);max-width:min(420px,88vw);text-align:center;
  box-shadow:var(--shadow);line-height:1.55}
#toast.on{opacity:1;visibility:visible;transform:translateX(-50%)}

/* ----------------------------------------------------- mobile nav sheet */
#sheet{position:fixed;inset:0;z-index:70;background:rgba(3,5,12,.94);backdrop-filter:blur(20px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#sheet.on{opacity:1;visibility:visible}
#sheet .navbtn{font-size:1rem;letter-spacing:.24em;padding:.7rem 1.2rem;font-family:var(--display);font-weight:200}
#sheetClose{position:absolute;top:1rem;right:1.2rem;background:none;border:1px solid var(--line);
  border-radius:50%;width:38px;height:38px;cursor:pointer;color:var(--muted);font-size:1.1rem}
@media(max-width:900px){
  #navlist,#textBtn{display:none}
  #menuBtn{display:block}
  #panelWrap{align-items:flex-end}
  #panel{max-height:74vh;width:100%}
}

/* --------------------------------------------------- accessible text view */
#textview{display:none;position:relative;z-index:80;max-width:74ch;margin:0 auto;
  padding:clamp(2rem,6vw,4.5rem) clamp(1.1rem,4vw,2rem) 6rem;background:var(--void)}
body.text-mode #textview{display:block}
body.text-mode canvas#scene,body.text-mode #hero,body.text-mode #hint,body.text-mode #vignette,
body.text-mode #panelWrap,body.text-mode #homeTag,body.text-mode #back{display:none}
body.text-mode #nav{background:linear-gradient(180deg,var(--void) 55%,rgba(3,5,12,0))}
#textview h1{font-size:clamp(2rem,6vw,3rem);font-weight:200;letter-spacing:.02em}
#textview h2{font-size:1.15rem;font-weight:400;margin:2.6rem 0 .9rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
#textview h3{font-size:.98rem;font-weight:400;margin:1.4rem 0 .3rem}
#textview p,#textview li{color:var(--muted);line-height:1.75;font-size:.93rem}
#textview ul{padding-left:1.1rem}
#textview a{color:var(--ion)}
#textview .sub{letter-spacing:.2em;font-size:.8rem;color:var(--dim);margin-top:.6rem}

/* -------------------------------------------------------- reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.14s !important}
  #heroName .l{opacity:1;transform:none;filter:none}
  #shine{display:none}
}

/* ------------------------------------------------------------ print/resume */
#resumeDoc{display:none}
@media print{
  body{overflow:visible;background:#fff;color:#111}
  body > *{display:none !important}
  #resumeDoc{display:block !important;font-family:var(--body);max-width:44rem;margin:0 auto;color:#111}
  #resumeDoc h1{font-size:1.6rem;font-weight:600;margin:0}
  #resumeDoc h2{font-size:.8rem;letter-spacing:.14em;margin:1.4rem 0 .4rem;border-bottom:1px solid #bbb;padding-bottom:.2rem;color:#111}
  #resumeDoc p,#resumeDoc li{font-size:.86rem;line-height:1.55;color:#222}
  #resumeDoc .meta{color:#555;font-size:.8rem}
}
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>

<!-- ------------------------------------------------------------- loader -->
<div id="loader" role="status" aria-live="polite">
  <div class="ring" aria-hidden="true"><i></i></div>
  <div id="loadTitle">INITIALIZING PERSONAL UNIVERSE</div>
  <div id="loadBarWrap"><div id="loadBar"></div></div>
  <div id="loadLog">Waking the engine…</div>
</div>

<!-- ---------------------------------------------------------------- nav -->
<nav id="nav" aria-label="Universe sections">
  <button id="brand" data-go="home"><b>TANISHK KEKAN</b><span>PERSONAL UNIVERSE</span></button>
  <div id="navlist"></div>
  <button id="textBtn" aria-pressed="false">TEXT VIEW</button>
  <button id="menuBtn" aria-expanded="false" aria-controls="sheet">MENU</button>
</nav>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Navigation">
  <button id="sheetClose" aria-label="Close navigation">✕</button>
  <div id="sheetlist"></div>
  <button class="navbtn" id="sheetText" style="margin-top:1.2rem;font-size:.72rem;letter-spacing:.2em;color:var(--dim)">TEXT VIEW</button>
</div>

<!-- --------------------------------------------------------------- hero -->
<header id="hero">
  <h1 id="heroName" aria-label="Tanishk Kekan"><span id="shine" aria-hidden="true"></span></h1>
  <p id="heroSub">Software Engineer &nbsp;·&nbsp; AI &amp; ML &nbsp;·&nbsp; Full-Stack Developer</p>
  <div id="heroLine" aria-hidden="true"></div>
  <button id="enter">ENTER UNIVERSE</button>
</header>

<div id="homeTag" aria-hidden="true"><b>Tanishk Kekan</b><span>SOFTWARE ENGINEER · AI &amp; ML</span></div>
<div id="hint">DRAG TO ORBIT · SCROLL TO ZOOM<br>CLICK ANY BODY TO EXPLORE</div>

<div id="tip" role="tooltip" aria-hidden="true"><b></b><small></small></div>
<button id="back">RETURN TO UNIVERSE</button>
<div id="toast" role="status" aria-live="polite"></div>

<div id="panelWrap">
  <section id="panel" role="dialog" aria-modal="false" aria-label="Section details" tabindex="-1"></section>
</div>

<!-- ------------------------------------------------- accessible text view -->
<main id="textview"></main>

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE  = window.matchMedia('(max-width: 900px), (pointer: coarse)').matches;
const rnd = (a,b) => a + Math.random()*(b-a);

function hash2(x,y,s){ const n = Math.sin(x*127.1 + y*311.7 + s*74.7) * 43758.5453123; return n - Math.floor(n); }
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
}
function fbm(x,y,s,oct){ let v=0,a=.5,f=1; for(let i=0;i<oct;i++){ v+=a*vnoise(x*f,y*f,s+i*17); f*=2; a*=.5; } return v; }
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function mix(c1,c2,t){ return [Math.round(lerp(c1[0],c2[0],t)),Math.round(lerp(c1[1],c2[1],t)),Math.round(lerp(c1[2],c2[2],t))]; }

/* tiny tween engine (no external animation lib needed) */
const tweens = [];
function tween(obj, keys, dur, ease){
  if (REDUCED) dur = Math.min(dur, .18);
  const from = {}; for (const k in keys) from[k] = obj[k];
  const t = { obj, keys, from, dur, t:0, ease: ease || (x => 1 - Math.pow(1-x, 3)), done:null };
  tweens.push(t); return { then(fn){ t.done = fn; return this; } };
}
function stepTweens(dt){
  for (let i=tweens.length-1;i>=0;i--){
    const t = tweens[i]; t.t += dt;
    const p = clamp(t.t/t.dur, 0, 1), e = t.ease(p);
    for (const k in t.keys) t.obj[k] = lerp(t.from[k], t.keys[k], e);
    if (p >= 1){ tweens.splice(i,1); if (t.done) t.done(); }
  }
}

/* ------------------------------------------------- 3. PROCEDURAL TEXTURES */
function canvasTex(w,h,draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}

function planetTexture(style, colors, seed){
  const W = MOBILE ? 256 : 384, H = W/2;
  return canvasTex(W, H, (ctx) => {
    const img = ctx.createImageData(W,H), d = img.data;
    const c0=hex2rgb(colors[0]), c1=hex2rgb(colors[1]), c2=hex2rgb(colors[2]);
    for (let y=0;y<H;y++){
      const v = y/H;
      for (let x=0;x<W;x++){
        const u = x/W;
        // seamless in u: sample noise on a circle
        const ang = u*TAU, R = 3.2;
        const nx = Math.cos(ang)*R + 8, ny = Math.sin(ang)*R + 8;
        let n;
        if (style === 'gas'){
          const bands = Math.sin(v*Math.PI*9 + fbm(nx*1.4, v*6, seed, 4)*4.2)*.5+.5;
          n = bands*.72 + fbm(nx*2.4, ny*2.4 + v*7, seed, 4)*.28;
        } else if (style === 'ice'){
          n = fbm(nx*2.1, ny*2.1 + v*4.5, seed, 4);
          n = n*.7 + (Math.abs(v-.5)>.34 ? .3 : 0);
        } else if (style === 'terra'){
          const land = fbm(nx*2.6, ny*2.6 + v*5, seed, 4);
          n = land > .5 ? .55 + (land-.5)*1.4 : land*.5;
        } else if (style === 'lava'){
          const crack = 1 - Math.abs(fbm(nx*3.4, ny*3.4 + v*6, seed, 4)*2 - 1);
          n = Math.pow(crack, 2.2);
        } else { // rocky
          n = fbm(nx*3.0, ny*3.0 + v*6, seed, 4);
          n += (hash2(x*0.7, y*0.7, seed) > .9986 ? .35 : 0); // craters / speckle
        }
        n = clamp(n, 0, 1);
        const col = n < .5 ? mix(c0, c1, n*2) : mix(c1, c2, (n-.5)*2);
        // pole shading
        const pole = 1 - Math.pow(Math.abs(v-.5)*2, 3)*.45;
        const i = (y*W+x)*4;
        d[i]=col[0]*pole; d[i+1]=col[1]*pole; d[i+2]=col[2]*pole; d[i+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
  });
}

function glowSprite(color, softness){
  return canvasTex(128,128,(ctx,w,h)=>{
    const g = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    g.addColorStop(0, color);
    g.addColorStop(softness||.18, color.replace('rgb','rgba').replace(')',',.55)'));
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  });
}
function starTexture(){
  return canvasTex(64,64,(ctx,w,h)=>{
    const g = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(.22,'rgba(255,255,255,.72)');
    g.addColorStop(.5,'rgba(160,200,255,.22)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  });
}
function nebulaTexture(rgb){
  return canvasTex(256,256,(ctx,w,h)=>{
    ctx.clearRect(0,0,w,h);
    for (let i=0;i<26;i++){
      const x=rnd(.15,.85)*w, y=rnd(.15,.85)*h, r=rnd(.12,.42)*w;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba('+rgb+','+rnd(.06,.16).toFixed(3)+')');
      g.addColorStop(1,'rgba('+rgb+',0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    }
  });
}
function ringTexture(inner, colorA, colorB){
  return canvasTex(512,16,(ctx,w,h)=>{
    for (let x=0;x<w;x++){
      const t = x/w;
      const band = (Math.sin(t*46)*.5+.5)*(Math.sin(t*13+1.2)*.5+.5);
      const a = clamp(band*.85 * (t>.04 && t<.97 ? 1 : 0) * (1-Math.pow(Math.abs(t-.5)*2,3)), 0, 1);
      ctx.fillStyle = 'rgba('+ (t<.5?colorA:colorB) +','+ a.toFixed(3) +')';
      ctx.fillRect(x,0,1,h);
    }
  });
}

function makeOrbitLine(radius, color, opacity){
  const pts = [];
  for (let i=0;i<=180;i++){ const a=i/180*TAU; pts.push(new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius)); }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:opacity||.1 });
  const line = new THREE.Line(geo, mat); line.userData.baseOpacity = opacity||.1;
  return line;
}

function atmosphere(radius, color, power){
  const mat = new THREE.ShaderMaterial({
    uniforms:{ c:{value:new THREE.Color(color)}, p:{value:power||2.6} },
    vertexShader:`varying vec3 vN; varying vec3 vP;
      void main(){ vN = normalize(normalMatrix*normal);
        vec4 mv = modelViewMatrix*vec4(position,1.0); vP = mv.xyz;
        gl_Position = projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 c; uniform float p; varying vec3 vN; varying vec3 vP;
      void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), p);
        gl_FragColor = vec4(c, f*0.95); }`,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent:true, depthWrite:false
  });
  return new THREE.Mesh(new THREE.SphereGeometry(radius*1.14, 32, 32), mat);
}

function makePlanet(opt){
  const g = new THREE.Group();
  const geo = new THREE.SphereGeometry(opt.radius, LOW?32:48, LOW?24:36);
  const mat = new THREE.MeshStandardMaterial({
    map: planetTexture(opt.style, opt.colors, opt.seed || Math.random()*90),
    roughness:.92, metalness:.02
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.pick = opt.pick;
  mesh.userData.baseScale = 1;
  g.add(mesh);
  g.add(atmosphere(opt.radius, opt.glow || opt.colors[1], opt.atmoPower));
  g.userData.mesh = mesh;
  g.userData.radius = opt.radius;
  spinners.push({ obj: mesh, speed: opt.spin || .12 });
  pickable.push(mesh);
  if (opt.tiltZ) g.rotation.z = opt.tiltZ;
  return g;
}

function addRing(group, radius, innerK, outerK, rgbA, rgbB, tilt){
  const geo = new THREE.RingGeometry(radius*innerK, radius*outerK, 128, 1);
  // remap uv so the texture runs radially
  const pos = geo.attributes.position, uv = geo.attributes.uv, v = new THREE.Vector3();
  for (let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i);
    const t = (v.length() - radius*innerK) / (radius*outerK - radius*innerK);
    uv.setXY(i, t, 0.5);
  }
  const mat = new THREE.MeshBasicMaterial({
    map: ringTexture(innerK, rgbA, rgbB), side:THREE.DoubleSide,
    transparent:true, opacity:.85, depthWrite:false, blending:THREE.NormalBlending
  });
  const ring = new THREE.Mesh(geo, mat);
  ring.rotation.x = Math.PI/2 + (tilt||.22);
  group.add(ring); return ring;
}

function buildStars(){
  const tex = starTexture();
  const layers = [
    { n: LOW?2600:6200, r:[420,900], size:2.4, op:.95 },
    { n: LOW?1800:4200, r:[240,520], size:1.7, op:.7  },
    { n: LOW?900:2000,  r:[120,300], size:1.2, op:.5  }
  ];
  layers.forEach((L, li) => {
    const pos = new Float32Array(L.n*3), col = new Float32Array(L.n*3), siz = new Float32Array(L.n);
    for (let i=0;i<L.n;i++){
      const r = rnd(L.r[0], L.r[1]);
      const th = rnd(0,TAU), ph = Math.acos(rnd(-1,1));
      pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1] = r*Math.cos(ph)*.62;
      pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
      // star colour classes: blue-white, white, warm
      const k = Math.random();
      const c = k<.16 ? [.62,.78,1] : k<.78 ? [1,1,1] : [1,.86,.68];
      const b = rnd(.45,1);
      col[i*3]=c[0]*b; col[i*3+1]=c[1]*b; col[i*3+2]=c[2]*b;
      siz[i] = L.size * rnd(.55,1.75);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('aColor',   new THREE.BufferAttribute(col,3));
    geo.setAttribute('size',     new THREE.BufferAttribute(siz,1));
    const mat = new THREE.ShaderMaterial({
      uniforms:{ uTex:{value:tex}, uTime:{value:0}, uOp:{value:L.op}, uPix:{value:Math.min(devicePixelRatio,2)}, uTwinkle:{value:REDUCED?0:1} },
      vertexShader:`attribute float size; attribute vec3 aColor; varying vec3 vC; varying float vT;
        uniform float uTime; uniform float uPix; uniform float uTwinkle;
        void main(){ vC = aColor;
          vT = 1.0 - uTwinkle*0.42*(0.5+0.5*sin(uTime*1.6 + position.x*0.09 + position.y*0.13));
          vec4 mv = modelViewMatrix*vec4(position,1.0);
          gl_PointSize = size*uPix*(300.0/-mv.z);
          gl_Position = projectionMatrix*mv; }`,
      fragmentShader:`uniform sampler2D uTex; uniform float uOp; varying vec3 vC; varying float vT;
        void main(){ vec4 t = texture2D(uTex, gl_PointCoord);
          gl_FragColor = vec4(vC, 1.0) * t * uOp * vT; }`,
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
    });
    const pts = new THREE.Points(geo, mat);
    pts.userData.parallax = .16 + li*.1;
    starLayers.push(pts); scene.add(pts);
  });
}

function buildNebulae(){
  const defs = [
    { rgb:'80,120,255',  pos:[-380,120,-520], scale:760, rot:.4 },
    { rgb:'150,90,255',  pos:[420,-140,-460], scale:640, rot:-.8 },
    { rgb:'60,200,255',  pos:[-120,-260,480], scale:560, rot:1.5 },
    { rgb:'255,150,120', pos:[520,220,340],   scale:420, rot:2.4 }
  ];
  defs.forEach(d=>{
    const m = new THREE.SpriteMaterial({ map: nebulaTexture(d.rgb), transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false, opacity:.85 });
    const s = new THREE.Sprite(m);
    s.position.set(d.pos[0], d.pos[1], d.pos[2]);
    s.scale.set(d.scale, d.scale*.7, 1);
    s.material.rotation = d.rot;
    scene.add(s);
  });
  // cosmic dust
  const n = LOW?900:2400, pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    const r = rnd(60,340), a = rnd(0,TAU);
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=rnd(-40,40); pos[i*3+2]=Math.sin(a)*r;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const dust = new THREE.Points(g, new THREE.PointsMaterial({
    size:.9, color:0x6f8fd0, transparent:true, opacity:.35, depthWrite:false,
    blending:THREE.AdditiveBlending, map: starTexture()
  }));
  dust.userData.dust = true; scene.add(dust); starLayers.push(dust);
}

function buildSun(){
  const g = new THREE.Group();
  const tex = canvasTex(512,256,(ctx,w,h)=>{
    const img = ctx.createImageData(w,h), d = img.data;
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const u=x/w, v=y/h, ang=u*TAU;
      const n = fbm(Math.cos(ang)*4+6, Math.sin(ang)*4+v*8, 3, 5);
      const c = mix([255,196,96],[255,252,225], clamp(n*1.3,0,1));
      const i=(y*w+x)*4; d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255;
    }
    ctx.putImageData(img,0,0);
  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(6, 48, 36),
    new THREE.MeshBasicMaterial({ map: tex }));
  core.userData.pick = { id:'home', kind:'section', label:'Tanishk Kekan', sub:'The centre of the system — start here' };

    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:.5 }));

function orbitBody(group, radius, speed, startAngle, lineColor, lineOp){
  const line = makeOrbitLine(radius, lineColor||0x5b86c8, lineOp||.09);
  scene.add(line);
  const o = { obj:group, radius, speed, angle:startAngle, line, yOff:0 };
  orbiters.push(o); scene.add(group);
  group.userData.orbit = o;
  group.userData.line = line;
  return o;
}

function launchShip(){
  if (!ship || ship.userData.launching || REDUCED) return;
  ship.userData.launching = true;
  const y0 = ship.position.y, e = ship.userData.engine;
  tween(ship.position, { y: y0 + 11 }, .6, t => t*t).then(() => {
    tween(ship.position, { y: y0 }, 1.2).then(() => { ship.userData.launching = false; });
  });
  tween(e.scale, { x: 12, y: 12 }, .45).then(() => tween(e.scale, { x: 4.4, y: 4.4 }, .9));
}

function setFocus(id, opts){
  opts = opts || {};
  const obj = bodies[id];
  focused = id;
  if (id === 'home'){ ctrl.follow = null; ctrl.anchor.set(0,0,0); ctrl.tRadius = 250; ctrl.tPhi = 1.12; ctrl.auto = true; }
  else if (obj){
    ctrl.follow = obj; ctrl.auto = false;
    const r = obj.userData.radius || 2;
    ctrl.tRadius = clamp(r * 5.2 + 6, 14, 120);
    ctrl.tPhi = 1.25;
    const wp = new THREE.Vector3(); obj.getWorldPosition(wp);
    ctrl.tTheta = Math.atan2(wp.x, wp.z) + .9;
  }
  $$('#navlist .navbtn, #sheetlist .navbtn').forEach(b => {
    b.setAttribute('aria-current', b.dataset.go === id ? 'true' : 'false');
  });
  $('#hero').classList.toggle('hidden', id !== 'home' || entered);
  $('#homeTag').classList.toggle('on', entered && id === 'home');
  $('#back').classList.toggle('on', id !== 'home');
}

function initControls(canvas){
  let lastX=0, lastY=0, pinch=0, moved=0;
  const down = e => {
    ctrl.drag = true; ctrl.auto = false; moved = 0;
    canvas.classList.add('grabbing');
    lastX = e.clientX; lastY = e.clientY;
    pointerPx = { x:e.clientX, y:e.clientY };
    pointer.x = (e.clientX/innerWidth)*2 - 1;
    pointer.y = -(e.clientY/innerHeight)*2 + 1;
    updateHover();
    canvas.setPointerCapture && e.pointerId!=null && canvas.setPointerCapture(e.pointerId);
  };
  const move = e => {
    pointerPx = { x:e.clientX, y:e.clientY };
    pointer.x = (e.clientX/innerWidth)*2 - 1;
    pointer.y = -(e.clientY/innerHeight)*2 + 1;
    if (!ctrl.drag) return;
    const dx = e.clientX-lastX, dy = e.clientY-lastY;
    moved += Math.abs(dx)+Math.abs(dy);
    ctrl.tTheta -= dx*0.0045;
    ctrl.tPhi = clamp(ctrl.tPhi - dy*0.0038, .16, Math.PI-.16);
    lastX = e.clientX; lastY = e.clientY;
  };
  const up = e => {
    canvas.classList.remove('grabbing');
    if (ctrl.drag && moved < 8) handleClick();
    ctrl.drag = false;
  };
  canvas.addEventListener('pointerdown', down);
  window.addEventListener('pointermove', move, { passive:true });
  window.addEventListener('pointerup', up);
  canvas.addEventListener('pointerleave', ()=>{ pointer.set(-5,-5); });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    ctrl.tRadius = clamp(ctrl.tRadius * (1 + Math.sign(e.deltaY)*0.09), ctrl.minR, ctrl.maxR);
  }, { passive:false });

  // pinch zoom
  let pinchStart = null;
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2){
      pinchStart = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      pinch = ctrl.tRadius;
    }
  }, { passive:true });
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStart){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      ctrl.tRadius = clamp(pinch * (pinchStart/d), ctrl.minR, ctrl.maxR);
    }
  }, { passive:true });
  canvas.addEventListener('touchend', ()=>{ pinchStart = null; }, { passive:true });
}

function handleClick(){
  if (!hovered) return;
  const p = hovered.userData.pick;
  if (!p) return;
  if (p.kind === 'section')      { enterUniverse(); setFocus(p.id); openPanel(p.id); }
  else if (p.kind === 'project') { enterUniverse(); setFocus(p.id); openProject(p.index); }
  else if (p.kind === 'skill')   { enterUniverse(); setFocus('skills'); openPanel('skills', p.label); }
  else if (p.kind === 'achievement'){ enterUniverse(); setFocus('achievements'); openPanel('achievements', p.index); }
  else if (p.kind === 'comet')   { toast(QUOTES[Math.floor(Math.random()*QUOTES.length)]); }
  else if (p.kind === 'hidden')  { toast('More projects are in orbit — this body is still unnamed.'); }
}

function updateHover(){
  if (MOBILE && !ctrl.drag) { /* still raycast for taps */ }
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickable, false);
  const hit = hits.length ? hits[0].object : null;
  if (hit !== hovered){
    if (hovered) setHover(hovered, false);
    hovered = hit;
    if (hovered) setHover(hovered, true);
    $('#scene').classList.toggle('pointing', !!hovered);
    const tip = $('#tip');
    if (hovered && hovered.userData.pick){
      tip.querySelector('b').textContent = hovered.userData.pick.label;
      tip.querySelector('small').textContent = hovered.userData.pick.sub || '';
      tip.classList.add('on');
    } else tip.classList.remove('on');
  }
  if (hovered){
    const tip = $('#tip');
    tip.style.left = pointerPx.x + 'px';
    tip.style.top  = pointerPx.y + 'px';
  }
}
function setHover(obj, on){
  obj.userData.hoverT = on ? 1 : 0;
  const parent = obj.parent;
  const line = (parent && parent.userData.line) || obj.userData.line;
  if (line) tween(line.material, { opacity: on ? .45 : (line.userData.baseOpacity||.1) }, .4);
}

function tickHover(dt){
  pickable.forEach(o => {
    const target = (o === hovered) ? 1.16 : 1;
    const s = o.scale.x;
    const ns = lerp(s, target, 1 - Math.pow(0.001, dt));
    o.scale.setScalar(ns);
  });
}

/* ------------------------------------------------- easter egg: konami */
function konami(){
  const seq = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let i = 0;
  window.addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    i = (k === seq[i]) ? i+1 : (k === seq[0] ? 1 : 0);
    if (i === seq.length){
      i = 0; hyperspace();
    }
  });
}
function hyperspace(){
  toast('Hyperspace engaged.');
  starLayers.forEach(l => { if (l.material.uniforms) tween(l.material.uniforms.uOp, { value: 2.2 }, .5).then(()=>tween(l.material.uniforms.uOp,{value: l===starLayers[0]?.95:.6},2.2)); });
  const r0 = ctrl.tRadius;
  ctrl.tRadius = clamp(r0*0.35, ctrl.minR, ctrl.maxR);
  setTimeout(()=>{ ctrl.tRadius = r0; }, 900);
}

/* ------------------------------------------------------- 7. BOOT LOOP */
function resize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.6 : 2));
  renderer.setSize(w, h, false);
}

let running = true;
document.addEventListener('visibilitychange', ()=>{ running = !document.hidden; });

function animate(){
  requestAnimationFrame(animate);
  if (!running) return;
  const dt = Math.min(clock.getDelta(), .05);
  const t  = clock.elapsedTime;
  if (document.body.classList.contains('text-mode')) return;  // nothing to draw
  frame++;

  /* orbits */
  for (const o of orbiters){
    o.angle += o.speed * dt * (REDUCED ? .35 : 1);
    o.obj.position.set(Math.cos(o.angle)*o.radius, o.yOff || 0, Math.sin(o.angle)*o.radius);
    if (o.line && !o.local) o.line.position.y = 0;
  }
  for (const s of spinners) s.obj.rotation.y += s.speed * dt;
  if (beltGroup) beltGroup.rotation.y += .012 * dt;
  if (galaxyGroup) galaxyGroup.rotation.y += .02 * dt;

  /* ship float */
  if (ship && !ship.userData.launching){
    ship.position.y = 12 + Math.sin(t*.7)*1.4;
    ship.rotation.z = Math.sin(t*.5)*.14;
    ship.rotation.y = Math.PI*.15 + Math.sin(t*.3)*.2;
    ship.userData.engine.scale.setScalar(4.4 + Math.sin(t*6)*.5);
  }

  /* satellite beacon pulse */
  const sat = bodies.contact;
  if (sat && sat.userData.beacon) sat.userData.beacon.scale.setScalar(5.5 + Math.sin(t*3)*1.6);

  /* comet path */
  if (comet){
    const ct = (t*.045) % 1;
    const a = ct*TAU;
    comet.position.set(Math.cos(a)*175, Math.sin(a*2)*40 + 30, Math.sin(a)*120);
    comet.lookAt(0, 0, 0);
  }

  /* starfield twinkle + parallax */
  starLayers.forEach(l => {
    if (l.material.uniforms) l.material.uniforms.uTime.value = t;
    if (l.userData.parallax){
      l.position.x = -camera.position.x * l.userData.parallax * .12;
      l.position.y = -camera.position.y * l.userData.parallax * .12;
      l.position.z = -camera.position.z * l.userData.parallax * .12;
    }
  });

  /* camera */
  if (ctrl.auto && !ctrl.drag && !REDUCED) ctrl.tTheta += dt * .012;
  if (ctrl.follow) ctrl.follow.getWorldPosition(ctrl.anchor);
  const k = 1 - Math.pow(REDUCED ? .0001 : .02, dt);
  ctrl.centre.lerp(ctrl.anchor, k);
  ctrl.theta  = lerp(ctrl.theta,  ctrl.tTheta,  k);
  ctrl.phi    = lerp(ctrl.phi,    ctrl.tPhi,    k);
  ctrl.radius = lerp(ctrl.radius, ctrl.tRadius, k);
  const sp = Math.sin(ctrl.phi);
  camera.position.set(
    ctrl.centre.x + ctrl.radius*sp*Math.sin(ctrl.theta),
    ctrl.centre.y + ctrl.radius*Math.cos(ctrl.phi),
    ctrl.centre.z + ctrl.radius*sp*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.centre);

  stepTweens(dt);
  if (frame % 2 === 0) updateHover();
  tickHover(dt);
  if (!entered) heroParallax();

  renderer.render(scene, camera);
}

/* ----------------------------------------------------------- loader run */
const STEPS = [
  ['Loading stars…',        () => { buildStars(); }],
  ['Loading nebulae…',      () => { buildNebulae(); }],
  ['Igniting the star…',    () => { buildSun(); }],
  ['Loading planets…',      () => { buildSystem(); }],
  ['Loading projects…',     () => { buildTextView(); }],
  ['Loading skills…',       () => { buildResumeDoc(); }],
  ['Loading experience…',   () => { buildHeroName(); }]
];

function boot(){
  const canvas = $('#scene');
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: !MOBILE, alpha:false, powerPreference:'high-performance' });
  } catch(err){ return fallback(); }
  if (!renderer || !renderer.getContext()) return fallback();

  renderer.setClearColor(0x03050c, 1);
  scene = new THREE.Scene();
  scene.fog = null;
  camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, .5, 3000);
  clock = new THREE.Clock();
  raycaster = new THREE.Raycaster();
  raycaster.params.Points.threshold = 2;
  resize();
  addEventListener('resize', resize);
  initControls(canvas);
  buildNav();
  konami();

  let i = 0;
  const next = () => {
    if (i < STEPS.length){
      $('#loadLog').textContent = STEPS[i][0];
      $('#loadBar').style.right = (100 - Math.round((i+1)/STEPS.length*100)) + '%';
      // paint the label first, then run the (sometimes heavy) build step
      requestAnimationFrame(()=>setTimeout(()=>{
        try { STEPS[i][1](); } catch(e){ console.error('build step failed:', e); }
        i++; next();
      }, REDUCED ? 30 : 140));
    } else {
      $('#loadLog').textContent = 'Welcome to Tanishk Kekan\u2019s Universe';
      $('#loadBar').style.right = '0%';
      animate();
      setTimeout(()=>{
        $('#loader').classList.add('done');
        $('#nav').classList.add('on');
        playHero();
        setFocus('home');
      }, REDUCED ? 220 : 900);
    }
  };
  next();
}

function fallback(){
  document.body.classList.add('text-mode');
  buildTextView(); buildResumeDoc(); buildNav();
  $('#loader').classList.add('done');
  $('#nav').classList.add('on');
  $('#textBtn').style.display = 'none';
  const warn = document.createElement('p');
  warn.style.cssText = 'color:var(--warm);font-size:.8rem;border-left:1px solid var(--warm);padding-left:.8rem';
  warn.textContent = 'WebGL is unavailable in this browser, so the 3D universe is switched off. Everything in it is written out below.';
  $('#textview').prepend(warn);
}

if (typeof THREE === 'undefined') fallback(); else boot();
</script>
